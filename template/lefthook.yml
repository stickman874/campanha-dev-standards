# campanha-dev-standards gates. Do not bypass with --no-verify.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint {staged_files}

pre-push:
  commands:
    typecheck:
      run: npx tsc --noEmit
    test:
      run: npm test --if-present -- --run
    review:   # sensitive paths only; routine diffs are reviewed by the night shift. SKIP_REVIEW=1 git push to force (humans only)
      use_stdin: true
      run: bash scripts/review.sh
