_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: ""
_answers_file: .copier-answers.yml
_skip_if_exists:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - CHANGELOG.md
  - DESIGN.md
  - SECURITY.md
  - docs/**
  - public/.well-known/security.txt
  - .claude/settings.json
  - .claude/rules/**
  - opencode.json
_tasks:
  # parallel workers create .claude/worktrees/ (Claude) and .opencode/worktrees/ (opencode); append, never overwrite the repo's own .gitignore.
  # Argument list, not a string: copier would run a string in cmd on native Windows. No shell variables: they expand empty under copier's subprocess on Windows, so one task per folder.
  - command: [bash, -c, "grep -qxF .claude/worktrees/ .gitignore 2>/dev/null || echo .claude/worktrees/ >> .gitignore"]
  - command: [bash, -c, "grep -qxF .opencode/worktrees/ .gitignore 2>/dev/null || echo .opencode/worktrees/ >> .gitignore"]
  - command: "mise install && lefthook install && echo 'adopted: run the doc-keeper agent to migrate existing docs'"
    when: "{{ _copier_operation == 'copy' }}"
project_name:
  type: str
  help: Project name (used in titles)
  default: "{{ _copier_conf.dst_path | basename }}"
tenant:
  type: str
  help: "single = one organisation uses it; multi = several client organisations share it (row-level isolation required)"
  choices: [single, multi]
  default: single
