_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: ""
_answers_file: .copier-answers.yml
_skip_if_exists:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - CHANGELOG.md
  - DESIGN.md
  - SECURITY.md
  - docs/**
  - public/.well-known/security.txt
  - .claude/settings.json
  - .claude/rules/**
_exclude:
  - "{% if backend == 'claude' %}.opencode{% endif %}"
  - "{% if backend == 'opencode' %}.claude/agents{% endif %}"
_tasks:
  # parallel subagents (isolation: worktree) create .claude/worktrees/; append, never overwrite the repo's own .gitignore
  - command: "grep -qxF '.claude/worktrees/' .gitignore 2>/dev/null || echo '.claude/worktrees/' >> .gitignore"
  - command: "mise install && lefthook install && echo 'adopted: run the doc-keeper agent to migrate existing docs'"
    when: "{{ _copier_operation == 'copy' }}"
project_name:
  type: str
  help: Project name (used in titles)
  default: "{{ _copier_conf.dst_path | basename }}"
tenant:
  type: str
  help: "single = one organisation uses it; multi = several client organisations share it (row-level isolation required)"
  choices: [single, multi]
  default: single
backend:
  type: str
  help: "opencode = workers, review and docs on DeepSeek via opencode go ($10/month per dev) + optional Codex; claude = Claude Code only (Haiku workers, Sonnet review and rescue, on the Claude subscription)"
  choices: [opencode, claude]
  default: opencode
