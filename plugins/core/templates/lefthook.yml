# campanha-dev-standards gates. Do not bypass with --no-verify.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint {staged_files}
    design-lint:
      glob: "*.{tsx,jsx,css}"
      run: bash scripts/design-lint.sh {staged_files}

pre-push:
  commands:
    typecheck:
      run: npx tsc --noEmit
    test:
      run: npm test --if-present -- --run
    semgrep:
      run: semgrep scan --config p/default --error --quiet --metrics=off
    trivy:
      run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --quiet --skip-files ".env*,**/.env*" .
